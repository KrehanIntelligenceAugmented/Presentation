  function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var j=0;j<x.length;j++)u[j]=x.charCodeAt(j);return u;}
  function show(html){document.open();document.write(html);document.close();}
  async function keyFromPw(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b(D.s),iterations:D.n,hash:"SHA-256"},base,256);
    return new Uint8Array(bits);
  }
  async function open(raw){
    var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},k,b(D.c));
    return new TextDecoder().decode(pt);
  }
  function enc(u){var s="";for(var j=0;j<u.length;j++)s+=String.fromCharCode(u[j]);return btoa(s);}
  function store(get,set){try{return set===undefined?(sessionStorage.getItem(KEY)||localStorage.getItem(KEY)):(set.local?localStorage.setItem(KEY,set.v):sessionStorage.setItem(KEY,set.v));}catch(e){return null;}}
  if(!window.crypto||!crypto.subtle){document.getElementById("msg").textContent="Dieser Browser unterstützt die Entschlüsselung nicht. Bitte einen aktuellen Browser verwenden.";return;}
  var saved=store();
  if(saved){open(b(saved)).then(show).catch(function(){try{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY);}catch(e){}});}
  document.getElementById("f").addEventListener("submit",async function(ev){
    ev.preventDefault();
    var btn=document.getElementById("go"),msg=document.getElementById("msg");
    btn.disabled=true;btn.textContent="Wird geöffnet …";msg.textContent="";
    try{
      var raw=await keyFromPw(document.getElementById("pw").value);
      var html=await open(raw);
      store(null,{v:enc(raw),local:document.getElementById("keep").checked});
      show(html);
    }catch(e){
      msg.textContent="Das Passwort stimmt nicht. Bitte erneut versuchen.";
      btn.disabled=false;btn.textContent="Infografik öffnen";
    }
  });
})();
</script>
